spring.application.name=rest-demo
server.port=8080

# ----------------------------------------------------
# MySQL
# ----------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/emsdb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ----------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------
# Redis cache
# Start Redis locally on 6379 before using cached endpoints.
# ----------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# ----------------------------------------------------
# Spring Batch
# ----------------------------------------------------
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ----------------------------------------------------
# Multipart upload
# ----------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.file-storage.directory=uploads/employee-documents

# ----------------------------------------------------
# Actuator
# ----------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Employee Management System
info.app.description=Spring Boot practical demonstrating REST, JPA, Redis, Batch and operations
info.app.version=1.0.0

# ----------------------------------------------------
# Swagger / OpenAPI
# ----------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
